<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portaria CEPAN - Fila de Acesso</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #334155;
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .titulo-area h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    .titulo-area p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .badge-contador {
      background-color: #1e293b;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      color: #e2e8f0;
    }

    .badge-contador strong {
      color: #38bdf8;
    }

    .fila-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-veiculo {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      border-left: 6px solid #64748b;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 768px) {
      .card-veiculo {
        grid-template-columns: 160px 1fr 140px 130px;
        align-items: center;
      }
    }

    .urgencia-alta {
      border-left-color: #ef4444;
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.1) 0%, #1e293b 40%);
    }

    .urgencia-media {
      border-left-color: #f59e0b;
    }

    .urgencia-baixa {
      border-left-color: #10b981;
    }

    .placa-box {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      background-color: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }

    .info-veiculo h3 {
      font-size: 1.05rem;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .info-veiculo p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .tempo-box {
      text-align: left;
    }

    @media (min-width: 768px) {
      .tempo-box {
        text-align: center;
      }
    }

    .tempo-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .tag-chegando {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .tag-perto {
      background-color: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .tag-longe {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .hora-prevista {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 4px;
    }

    .btn-liberar {
      background-color: #16a34a;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-liberar:hover {
      background-color: #15803d;
    }

    .vazio {
      text-align: center;
      padding: 48px 16px;
      color: #64748b;
      background-color: #1e293b;
      border-radius: 12px;
      border: 1px dashed #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="titulo-area">
        <h1>Portaria CEPAN - Fila de Acesso</h1>
        <p>Monitoramento em tempo real (Firestore Conectado)</p>
      </div>
      <div class="stats">
        <div class="badge-contador">Aguardando: <strong id="qtdFila">0</strong></div>
      </div>
    </header>

    <main class="fila-container" id="filaVeiculos">
      <div class="vazio">Conectando ao banco de dados...</div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas credenciais do Firebase configuradas
    const firebaseConfig = {
      apiKey: "AIzaSyCsO89sOJP9xoQH0-b4Lyf2D_E9ku_JKc0",
      authDomain: "cepan-acesso.firebaseapp.com",
      projectId: "cepan-acesso",
      storageBucket: "cepan-acesso.firebasestorage.app",
      messagingSenderId: "179404408385",
      appId: "1:179404408385:web:6afff01f3b82ca6f2668c0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const container = document.getElementById('filaVeiculos');
    const contador = document.getElementById('qtdFila');

    const q = query(
      collection(db, "solicitacoes_acesso"), 
      where("status", "==", "AGUARDANDO")
    );

    onSnapshot(q, (snapshot) => {
      let lista = [];
      const agora = Date.now();

      snapshot.forEach((documento) => {
        const dados = documento.data();
        const diferencaMs = dados.horarioPrevisto - agora;
        const minutosRestantes = Math.round(diferencaMs / 60000);

        lista.push({
          id: documento.id,
          ...dados,
          minutosRestantes: minutosRestantes
        });
      });

      lista.sort((a, b) => a.horarioPrevisto - b.horarioPrevisto);

      contador.innerText = lista.length;
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = `
          <div class="vazio">
            <h3>Nenhum veículo aguardando no momento</h3>
            <p>Novas solicitações aparecerão aqui automaticamente.</p>
          </div>
        `;
        return;
      }

      lista.forEach((item) => {
        let classeUrgencia = 'urgencia-baixa';
        let tagTexto = `~${item.minutosRestantes} min`;
        let classeTag = 'tag-longe';

        if (item.minutosRestantes <= 2) {
          classeUrgencia = 'urgencia-alta';
          tagTexto = item.minutosRestantes <= 0 ? 'Chegando agora' : `~${item.minutosRestantes} min`;
          classeTag = 'tag-chegando';
        } else if (item.minutosRestantes <= 6) {
          classeUrgencia = 'urgencia-media';
          tagTexto = `~${item.minutosRestantes} min`;
          classeTag = 'tag-perto';
        }

        const card = document.createElement('div');
        card.className = `card-veiculo ${classeUrgencia}`;
        card.innerHTML = `
          <div class="placa-box">${item.placa}</div>
          <div class="info-veiculo">
            <h3>${item.veiculo}</h3>
            <p><strong>${item.colaborador}</strong> • ${item.empresa}</p>
          </div>
          <div class="tempo-box">
            <span class="tempo-tag ${classeTag}">${tagTexto}</span>
            <div class="hora-prevista">Previsão: ${item.horarioPrevistoFormatado}</div>
          </div>
          <button class="btn-liberar" data-id="${item.id}">Liberar Entrada</button>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll('.btn-liberar').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const docId = e.target.getAttribute('data-id');
          e.target.disabled = true;
          e.target.innerText = "Liberando...";
          
          await updateDoc(doc(db, "solicitacoes_acesso", docId), {
            status: "LIBERADO",
            liberadoEm: new Date()
          });
        });
      });
    }, (erro) => {
      console.error("Erro ao escutar Firestore:", erro);
      container.innerHTML = `<div class="vazio">Erro ao carregar dados. Verifique as credenciais.</div>`;
    });
  </script>
</body>
</html>
