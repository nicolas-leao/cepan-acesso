<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portaria CEPAN - Painel de Controle</title>

  <!-- Ícone da aba do navegador e atalho de aplicativo no celular -->
  <link rel="icon" type="image/png" href="icone.png" />
  <link rel="apple-touch-icon" href="icone.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Login da portaria (Firebase Auth, e-mail e senha) -->
  <div id="telaLogin" class="tela-login">
    <form id="formLogin" class="caixa-login" novalidate>
      <h2>Acesso Restrito</h2>
      <p id="textoLogin">Verificando acesso...</p>

      <div id="camposLogin" class="oculto">
        <label for="inputEmail" class="rotulo-login">E-mail</label>
        <input type="email" id="inputEmail" class="input-login" autocomplete="username" required />

        <label for="inputSenha" class="rotulo-login">Senha</label>
        <input type="password" id="inputSenha" class="input-login" autocomplete="current-password" required />

        <button type="submit" id="btnEntrar" class="btn-exportar btn-bloco">Acessar Painel</button>
      </div>

      <p id="erroLogin" class="erro-login" role="alert"></p>
    </form>
  </div>

  <!-- Conteúdo do Painel (exibido só após login validado) -->
  <div class="container oculto" id="conteudoPainel">
    <header>
      <div class="titulo-area">
        <h1>Portaria CEPAN</h1>
        <p>Monitoramento e Relatório de Acesso</p>
      </div>
      <div class="header-actions">
        <span class="usuario-logado" id="usuarioLogado"></span>
        <button type="button" class="btn-audio" id="btnAudioToggle" aria-pressed="false">🔔 Alerta Sonoro: OFF</button>
        <button type="button" class="btn-sair" id="btnSairPortaria">🔒 Sair</button>
        <div class="badge-contador">Fila: <strong id="qtdFila" aria-live="polite">0</strong></div>
      </div>
    </header>

    <nav class="nav-abas">
      <button type="button" class="tab-btn active" id="tabFila">🚗 Fila Operacional</button>
      <button type="button" class="tab-btn" id="tabRelatorio">📊 Relatórios e Dashboard</button>
    </nav>

    <!-- ABA 1: Fila ao Vivo -->
    <main class="fila-container" id="secaoFila">
      <div class="vazio">Conectando ao banco de dados...</div>
    </main>

    <!-- ABA 2: Relatórios & Indicadores -->
    <section class="relatorio-container" id="secaoRelatorio">
      <div class="kpis-grid">
        <div class="kpi-card">
          <h4>Acessos Liberados no Período</h4>
          <div class="val" id="kpiTotal">0</div>
        </div>
        <div class="kpi-card">
          <h4>Empresa Top Recorrente</h4>
          <div class="val val-texto" id="kpiEmpresaTop">-</div>
        </div>
        <div class="kpi-card">
          <h4>Descartados no Período</h4>
          <div class="val val-alerta" id="kpiDescartados">0</div>
        </div>
      </div>

      <div class="controles-relatorio">
        <div class="filtros-data">
          <button type="button" class="btn-filtro active" data-filtro="hoje">Hoje</button>
          <button type="button" class="btn-filtro" data-filtro="semana">Últimos 7 dias</button>
          <button type="button" class="btn-filtro" data-filtro="tudo">Todos</button>
        </div>

        <input type="search" id="inputBusca" class="input-busca" placeholder="🔍 Buscar por placa, nome ou empresa..." aria-label="Buscar no relatório" />

        <button type="button" class="btn-exportar" id="btnExportar">📥 Exportar para Excel (.CSV)</button>
      </div>

      <p class="nota-relatorio" id="notaRelatorio"></p>

      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Placa</th>
              <th>Veículo</th>
              <th>Solicitante</th>
              <th>Empresa</th>
              <th>Data/Hora</th>
              <th>Status</th>
              <th>Por</th>
              <th class="centro">Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaHistoricoCorpo">
            <tr><td colspan="8" class="celula-info">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    function falhaCarregamento() {
      var t = document.getElementById('textoLogin');
      var e = document.getElementById('erroLogin');
      if (t) t.textContent = 'Não foi possível carregar o sistema.';
      if (e) e.textContent = 'Confira se firebase-config.js, app.js e styles.css estão na mesma pasta do site e abra a página por endereço http(s), não com duplo clique no arquivo. Detalhes: tecla F12 > aba Console.';
    }
    setTimeout(function () { if (!window.__cepanIniciou) falhaCarregamento(); }, 10000);
  </script>
  <script type="module" src="app.js" onerror="falhaCarregamento()"></script>
</body>
</html>
